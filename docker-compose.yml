services:
  frontend:
    container_name: glicechart-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    image: glicechart-frontend:latest
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    environment:
      TZ: Europe/Rome

  backend:
    container_name: glicechart-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    image: glicechart-backend:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Rome
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-glicechart}
      DB_PASSWORD: ${DB_PASSWORD:-glicechart}
      DB_NAME: ${DB_NAME:-glicechart}
      PORT: 3001
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-5}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      GLUROO_BASE_URL: ${GLUROO_BASE_URL:-}
      GLUROO_API_SECRET_TOKEN: ${GLUROO_API_SECRET_TOKEN:-}
      GLUROO_API_SECRET_HEADER: ${GLUROO_API_SECRET_HEADER:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
